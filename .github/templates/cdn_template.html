        body {

        .header h1 {

            margin-bottom: 0.5rem;
        }

        .search-container {
            position: sticky;
            top: 0;
            padding: 1rem;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border-radius: 0 0 10px 10px;
        }

        .file-card {
            border-radius: 10px;
            border: 1px solid #e9ecef;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%;
            background-color: white;

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .preview-container {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            overflow: hidden;
            border-bottom: 1px solid #e9ecef;
        }

        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .preview-icon {
            font-size: 3rem;
            color: #adb5bd;
        }

        .file-details {
            padding: 1.25rem;
        }

        .file-name {
            font-weight: 600;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.5rem;
        }

        .file-path {
            font-size: 0.8rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.75rem;
        }

        .file-size {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }

        .copy-btn {
            width: 100%;
            border-radius: 6px;
            border: none;
            background-color: var(--bs-primary);
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: #2c5e41;
        }

        .filters {
            margin-bottom: 2rem;
        }

            margin-bottom: 0.5rem;
            border-radius: 20px;
            padding: 0.4rem 1rem;
            transition: all 0.2s;
        }
