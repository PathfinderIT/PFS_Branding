name: Generate CDN Links with Preview HTML Page

on:
  push:
    branches:
      - main  # or your default branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  generate-cdn-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow jinja2  # For image handling and templating

      - name: Generate CDN links HTML
        run: python .github/scripts/generate_cdn_links.py
      
      - name: Commit and push HTML page
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cdn-preview.html
          git commit -m "Update CDN preview page [skip ci]" || echo "No changes to commit"
          git push
